<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/logo/vedexim.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>VED EXIM</title>

    <style>
      #intro-loader {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;
        height: 100svh;

        z-index: 999999;

        background: #171614;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        opacity: 1;
        visibility: visible;

        transition:
          opacity 0.7s ease,
          visibility 0.7s ease;
      }

      #intro-loader.intro-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }


      #intro-loader {
        flex-direction: column;
        gap: 38px;
        padding: 24px;
      }

      #intro-logo {
        width: min(280px, 62vw);
        height: auto;
        filter: brightness(0) invert(1);
      }

      .loader-progress {
        width: min(260px, 68vw);
      }

      .loader-progress-track {
        width: 100%;
        height: 1px;
        overflow: hidden;
        background: rgba(244, 241, 235, 0.25);
      }

      #loader-progress-bar {
        width: 0%;
        height: 100%;
        background: #f4f1eb;
        transition: width 0.12s linear;
      }

      .loader-progress-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        color: #f4f1eb;
        font-family: Arial, sans-serif;
        font-size: 8px;
        letter-spacing: 2px;
      }

      @media (max-width: 650px) {
        #intro-loader {
          gap: 28px;
        }
      }
    </style>
  </head>


  <body>

    <!-- =========================================
         VED EXIM LOADER
    ========================================== -->

    <div id="intro-loader">

      <img
        id="intro-logo"
        src="/images/logo/vedexim.svg"
        alt="Ved Exim"
      />

      <div class="loader-progress">
        <div class="loader-progress-track">
          <div id="loader-progress-bar"></div>
        </div>

        <div class="loader-progress-meta">
          <span>LOADING</span>
          <span id="loader-progress-value">0%</span>
        </div>
      </div>

    </div>


    <!-- =========================================
         REACT WEBSITE
    ========================================== -->

    <div id="root"></div>


    <script
      type="module"
      src="/src/main.jsx"
    ></script>


    <!-- =========================================
         LOADER CONTROL
    ========================================== -->

    <script>

      (function () {

        const loader =
          document.getElementById(
            "intro-loader"
          );

        const progressBar =
          document.getElementById(
            "loader-progress-bar"
          );

        const progressValue =
          document.getElementById(
            "loader-progress-value"
          );


        if (
          !loader ||
          !progressBar ||
          !progressValue
        ) {
          return;
        }


        let progress = 0;
        let removed = false;


        /* =========================================
           REMOVE INTRO
        ========================================= */

        function removeIntro() {

          if (removed) {
            return;
          }

          removed = true;


          /*
           * Fade out intro
           */

          loader.classList.add(
            "intro-hidden"
          );


          /*
           * Remove after fade
           */

          setTimeout(function () {

            if (loader) {
              loader.remove();
            }

          }, 750);

        }


        const updateProgress = function () {
          progress = Math.min(progress + 2, 100);
          progressBar.style.width = progress + "%";
          progressValue.textContent = progress + "%";

          if (progress === 100) {
            setTimeout(removeIntro, 250);
            return;
          }

          setTimeout(updateProgress, 24);
        };

        updateProgress();

      })();

    </script>

  </body>
</html>
